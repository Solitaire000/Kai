name: write_file
description: "在工作区内创建或覆盖一个文本文件，写入指定内容。会修改磁盘上的文件，需要用户确认。"
category: filesystem
dangerous: true
parameters:
  type: object
  properties:
    path:
      type: string
      description: "相对于工作区根目录的文件路径，比如 notes/todo.txt"
    content:
      type: string
      description: "要写入的完整文本内容"
    append:
      type: boolean
      description: "true=追加到文件末尾，false或不填=覆盖整个文件"
  required: ["path", "content"]
preview_template: "写入文件: {path}"
