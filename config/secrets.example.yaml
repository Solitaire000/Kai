# 复制这个文件为 secrets.yaml（不要改名字，main.py 会自动加载 secrets.yaml）
# secrets.yaml 已在 .gitignore 里，不会被误传到网上
#
# 为什么不用系统环境变量：因为你要在3台不同电脑间切换，
# 系统环境变量得在每台电脑上重新设置一遍，很麻烦。
# 把key写在硬盘里的这个文件里，插到哪台电脑都能直接用。

SILICONFLOW_API_KEY: "sk-xxxxxxxxxxxxxxxx"
OPENROUTER_API_KEY: "sk-or-xxxxxxxxxxxxxxxx"
ZHIPU_API_KEY: "xxxxxxxxxxxxxxxx"
ANTHROPIC_API_KEY: ""   # 不用可以留空，config.yaml里默认也是关闭的
